[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dwclib"
version = "2025.12.5"
description = "Python wrapper to DataWarehouse Connect"
authors = [{ name = "Jona Joachim", email = "jona@joachim.cc" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "ISC"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2,<3",
    "SQLAlchemy>=2,<2.0.40",
    "platformdirs>=3,<4",
    "pyarrow>=23.0.1",
    "pymssql>=2.3,!=2.3.13,<3",
]

[project.optional-dependencies]
dwcmeta = ["psycopg[binary]>=3.2.3,<4"]
dask = ["dask[dataframe]>=2024.4.1,<2025"]
mcp = ["fastmcp>=2,<3"]

[project.scripts]
dwclib-mcp = "dwclib.mcp.server:main"

[project.urls]
Repository = "https://github.com/larib-data/dwclib"

[dependency-groups]
lint = [
    "flake8",
    "flake8-bandit",
    "flake8-bugbear",
    "flake8-docstrings",
    "darglint",
]
docs = [
    "sphinx",
    "sphinx-autodoc-typehints",
]
audit = ["pip-audit"]
dev = [
    "nox",
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "audit" },
]
